name: plugin-manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate .claude-plugin manifests are well-formed JSON
        run: |
          python3 -c "import json,sys; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json')); json.load(open('hooks/hooks.json')); print('manifests OK')"
      - name: Hook shim runs and exits 0 on empty input
        run: |
          out=$(echo '{}' | python3 scripts/hook.py); code=$?
          test "$code" = "0" && test "$out" = "{}" && echo "hook shim OK"
