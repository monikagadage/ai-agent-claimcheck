# receipts is a Claude Code plugin, not a distributed Python package — there is no
# build backend here on purpose. This file only configures dev tooling.

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["tests/_build.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",     # long regexes and evidence strings are fine
  "RUF001",   # we deliberately match "smart" quotes/dashes that LLM output uses
  "RUF002",
  "RUF003",
]


[tool.mypy]
python_version = "3.9"
files = ["receipts"]
ignore_missing_imports = true
warn_unused_ignores = true
